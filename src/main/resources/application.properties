initial.data.file=classpath:initial-data.txt
security.password.length=10

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/gym_crm
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

hibernate.show_sql=true
hibernate.format_sql=true
hibernate.hbm2ddl.auto=update

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Gym CRM API
info.app.description=REST API for gym trainee/trainer/training management
info.app.version=1.0-SNAPSHOT