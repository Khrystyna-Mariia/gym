server.port=8082
eureka.client.service-url.defaultZone=${EUREKA_URI}
eureka.instance.prefer-ip-address=true

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL}
spring.activemq.user=${ACTIVEMQ_USER}
spring.activemq.password=${ACTIVEMQ_PASSWORD}

jms.listener.concurrency=5-15
activemq.redelivery.max-attempts=3