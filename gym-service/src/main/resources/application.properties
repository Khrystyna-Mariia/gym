spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

initial.data.file=classpath:initial-data.txt
security.password.length=10

jwt.expiration-ms=${jwt_expiration_ms:3600000}

service.jwt.expiration-ms=60000

management.info.env.enabled=true
info.app.name=Gym CRM API
info.app.description=REST API for gym trainee/trainer/training management
info.app.version=1.0-SNAPSHOT

security.login.max-attempts=3
security.login.lock-duration-minutes=5

spring.application.name=gym-service
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

jms.workload-queue=workload.events